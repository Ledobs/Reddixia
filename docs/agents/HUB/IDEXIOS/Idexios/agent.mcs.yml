conversationStarters:
  - title: Analyse du portefeuille
    text: Quels sont les projets sensibles dans mon portefeuille actuellement?

  - title: Budget et capacité
    text: Prépare moi une synthèse sur le budget et la capacité des équipes pour le prochain comité

  - title: Scénarios de priorisation
    text: "Génère des scénarios de priorisation pour les projets du portefeuille en appliquant une méthode structurée de scoring basée sur les critères suivants : **CRITÈRES DE PRIORISATION (Total 100 points)** : 1) Alignement stratégique (30 pts) - Contribution aux objectifs d'affaires prioritaires, soutien à la vision organisationnelle, impact sur les initiatives stratégiques ; 2) Valeur et bénéfices (25 pts) - ROI financier estimé, réduction de coûts opérationnels, augmentation de revenus, amélioration de productivité, bénéfices intangibles (satisfaction client, image de marque) ; 3) Urgence et contraintes (20 pts) - Échéances réglementaires ou contractuelles obligatoires, dépendances critiques bloquant d'autres projets, risques de pénalités ou pertes d'opportunités, obsolescence technologique imminente ; 4) Risques et faisabilité (15 pts) - Niveau de complexité technique, maturité de la solution, disponibilité des compétences, risques d'exécution, probabilité de succès ; 5) Effort et investissement (10 pts) - Ratio valeur/effort favorable, durée du projet, consommation de ressources critiques, budget requis proportionnel aux bénéfices. **RÈGLES DE PRIORISATION** : Projets scoring 80+ = Priorité HAUTE (exécution immédiate) ; 60-79 = Priorité MOYENNE (planification prochaine vague) ; 40-59 = Priorité BASSE (évaluation report) ; <40 = Candidats suspension. **SCÉNARIOS À GÉNÉRER** : Scénario 1 (Budget complet) - Tous projets priorité haute + sélection moyenne jusqu'à saturation budget et capacité ; Scénario 2 (Budget -15%) - Projets haute priorité obligatoires + projets moyenne avec meilleur ratio valeur/coût ; Scénario 3 (Budget -30%) - Uniquement projets haute priorité avec contraintes réglementaires et dépendances critiques. Pour chaque scénario, présente : liste projets retenus avec leur score et justification, budget total consommé vs disponible, capacité équipe requise, projets reportés et impact de ce report, valeur totale livrée estimée, risques du scénario. Identifie aussi les quick wins (score 70+, durée <3 mois, budget <100K$) pour gains rapides."

  - title: Livrables à venir
    text: Quels sont les principaux livrables prévus pour le prochain mois?

  - title: Risques du portefeuille
    text: Identifie les principaux risques et dépendances entre les projets de mon portefeuille

  - title: Rapport exécutif
    text: "Génère un rapport exécutif complet pour le comité de direction qui inclut les éléments suivants : 1) Un sommaire exécutif présentant l'état global du portefeuille avec les indicateurs clés de performance (nombre total de projets actifs, budget total engagé vs dépensé, taux d'utilisation des ressources) ; 2) Une analyse détaillée des projets classés par statut (vert/jaune/rouge) avec pour chaque catégorie le nombre de projets, le budget associé et les principaux enjeux ; 3) Les 5 projets prioritaires identifiés comme sensibles ou à haut risque avec leur justification, impact potentiel sur l'organisation et recommandations d'actions ; 4) Une vue consolidée de la capacité des équipes par département montrant l'allocation actuelle vs disponible et les zones de surcharge ; 5) Les livrables majeurs prévus pour les 3 prochains mois avec leurs dates cibles et niveaux de confiance d'atteinte ; 6) Un tableau de bord financier montrant la consommation budgétaire par programme, les écarts vs prévisions et les projections de fin d'année ; 7) Les risques transversaux du portefeuille et les dépendances critiques entre projets qui pourraient impacter la livraison ; 8) Des recommandations stratégiques pour l'optimisation du portefeuille incluant les opportunités de consolidation, les projets candidates à la suspension ou report, et les investissements recommandés. Le rapport doit être structuré de manière claire avec des visualisations appropriées (tableaux, graphiques) et un langage accessible pour les dirigeants non-techniques. Présente aussi les tendances comparées au mois précédent pour contextualiser l'évolution de la santé du portefeuille. Assure-toi d'inclure les données les plus récentes de Dataverse/TPG et de signaler toute information manquante ou incomplète qui pourrait limiter l'analyse."

